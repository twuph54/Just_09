<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在跳转...</title>
    <meta http-equiv="refresh" content="0; url=https://www.bilibili.com/video/BV1UT42167xb">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0b0f17;
            color: #eef4ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 1rem;
        }
        .box {
            background: #131b2c;
            padding: 3rem 2.5rem;
            border-radius: 24px;
            border: 1px solid rgba(79, 140, 255, 0.25);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.8);
            max-width: 420px;
            width: 100%;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(79, 140, 255, 0.2);
            border-top-color: #4f8cff;
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }
        p {
            color: #a3b3d6;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }
        a {
            display: inline-block;
            background: #4f8cff;
            color: #fff;
            text-decoration: none;
            padding: 0.75rem 2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        a:hover {
            background: #2a6eff;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <h1>正在跳转</h1>
        <p>即将前往 Bilibili 视频页面</p>
        <a href="https://www.bilibili.com/video/BV1UT42167xb">立即前往</a>
    </div>

    <script>
        // 立即跳转（备用方案，确保兼容性）
        window.location.replace("https://www.bilibili.com/video/BV1UT42167xb");
    </script>
</body>
</html>
